# PR/push: quality gate only (lint, types, stylelint, Vitest coverage: 100% src-electron + helpers;
# src .ts thresholds per vitest/ — Vue SFCs watermarks only). Storybook VRT (`yarn test:storybook:visual*`) runs locally or via
# `yarn testbatch:ensure:nochange` — not in CI.
name: Verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Reused by build.yml as its pre-package quality gate.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    # macOS catches platform-only failures Ubuntu misses (e.g. '/var' -> '/private/var' tmpdir realpath).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      # Storybook workspace install: ESLint scopes .storybook-workspace
      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn
        with:
          install-storybook: 'true'

      - name: Quality gate
        run: yarn testbatch:verify
