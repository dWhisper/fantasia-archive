# Manually triggered release build. Packages the production Electron app for
# Windows, macOS, and Linux after the verify.yml quality gate passes (lint, types,
# stylelint, Vitest coverage). Playwright and Storybook VRT stay in the
# pr-full-suite-* workflows. Linux uses a matrix so each installer format installs
# only the tooling it needs.

name: Build App - FA Rewrite

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version of the application being built'
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Quality gate
    uses: ./.github/workflows/verify.yml

  build-windows:
    name: Windows package
    needs: verify
    runs-on: windows-latest
    environment: production
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Production Electron build
        run: yarn quasar:build:electron

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Windows_FA ${{ github.event.inputs.version }}
          path: dist/electron/Packaged/*.exe

  build-linux:
    name: Linux (${{ matrix.linux_pkg }})
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        linux_pkg:
          - AppImage
          - deb
          - rpm
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Install base packaging tools (deb/rpm/AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot \
            rpm

      - name: Production Electron build (${{ matrix.linux_pkg }})
        env:
          FA_ELECTRON_LINUX_TARGETS: ${{ matrix.linux_pkg }}
        run: yarn quasar:build:electron

      - name: Upload Linux artifact (${{ matrix.linux_pkg }})
        uses: actions/upload-artifact@v5
        with:
          name: Linux_${{ matrix.linux_pkg }}_FA ${{ github.event.inputs.version }}
          path: dist/electron/Packaged/

  build-macos:
    name: macOS package
    needs: verify
    runs-on: macOS-latest
    environment: production
    timeout-minutes: 120
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup-node-yarn

      - name: Production Electron build
        run: yarn quasar:build:electron

      - name: Upload MacOS Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Mac_FA ${{ github.event.inputs.version }}
          path: dist/electron/Packaged/*.dmg
